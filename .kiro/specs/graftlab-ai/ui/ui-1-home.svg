<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Inter, system-ui, sans-serif">
  <title>UI 1 Home</title>
  <style>
    .bg{fill:#0f0b14}.panel{fill:#1a1422;stroke:#3a2d4a}.t{fill:#e9e3f0}.m{fill:#9b8fae}.acc{fill:#ff8a1f}
    .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  </style>
  <rect class="bg" width="1280" height="800"/>
  <!-- top bar -->
  <text x="32" y="36" class="t" font-size="16" font-weight="600">🧪 GraftLab AI</text>
  <text x="1248" y="36" class="m" font-size="13" text-anchor="end">Queue: you are the operator · 2 watching</text>

  <!-- hero -->
  <text x="640" y="250" class="t" font-size="56" font-weight="700" text-anchor="middle">GraftLab <tspan class="acc">AI</tspan></text>
  <text x="640" y="292" class="m" font-size="17" text-anchor="middle">Paste a GitHub repository. A team of AI roles reads it, meets with you, and decides how to make it AI-powered.</text>

  <!-- URL input -->
  <rect x="290" y="330" width="700" height="60" rx="30" class="panel" stroke-width="2"/>
  <text x="322" y="367" class="m mono" font-size="17">https://github.com/sissbruecker/linkding</text>
  <rect x="868" y="338" width="114" height="44" rx="22" fill="#ff8a1f"/>
  <text x="925" y="366" fill="#1a0f05" font-size="16" font-weight="700" text-anchor="middle">Graft it</text>
  <!-- validation feedback (R9, R6) -->
  <text x="322" y="414" fill="#7cff6b" font-size="13">✓ Public repository · Adapted target: reading, sandbox, browser experience and development are available</text>

  <!-- scope line -->
  <text x="640" y="470" class="m" font-size="13" text-anchor="middle">Any public repository: read-only analysis and meeting. Only adapted targets (linkding) are executed, always in a sandbox.</text>

  <!-- replay entry -->
  <rect x="470" y="520" width="340" height="96" rx="14" class="panel"/>
  <rect x="490" y="538" width="72" height="22" rx="11" fill="#3a2d4a"/>
  <text x="526" y="554" class="t" font-size="12" font-weight="700" text-anchor="middle">Replay</text>
  <text x="576" y="554" class="t" font-size="14">linkding · full run, 41 min</text>
  <text x="490" y="590" class="m" font-size="13">Recorded events, not live. Watch while you wait.</text>

  <text x="640" y="770" class="m" font-size="12" text-anchor="middle">Success is decided only by the independent Verifier (code, no LLM). Failures are shown as they happen.</text>
</svg>
