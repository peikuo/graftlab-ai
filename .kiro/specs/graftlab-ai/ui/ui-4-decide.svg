<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Inter, system-ui, sans-serif">
  <title>UI 4 Workspace: decision step (draft, item review, freeze)</title>
  <style>
    .bg{fill:#0f0b14}.panel{fill:#1a1422;stroke:#3a2d4a}.t{fill:#e9e3f0}.m{fill:#9b8fae}
    .work{fill:#7cff6b}.think{fill:#8fd3ff}.wait{fill:#ffc857}.fail{fill:#ff5468}.acc{fill:#ff8a1f}
    .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  </style>
  <rect class="bg" width="1280" height="800"/>
  <rect width="1280" height="48" fill="#140f1b"/>
  <text x="20" y="30" class="t" font-size="15" font-weight="600">🧪 GraftLab AI</text>
  <text x="170" y="30" class="m mono" font-size="13">sissbruecker/linkding @ v1.47.0</text>
  <rect x="1180" y="14" width="80" height="22" rx="11" fill="#7cff6b"/><text x="1220" y="30" fill="#0f0b14" font-size="12" font-weight="700" text-anchor="middle">● LIVE</text>
  <g font-size="12">
    <text x="20" y="72" class="work">✓ reading ✓ adapter ✓ sandbox_start ✓ browser_experience ✓ meeting ✓ deciding</text>
    <text x="540" y="72" class="t" font-weight="700">▶ awaiting_confirmation</text>
    <text x="700" y="72" class="m">frozen · planning · documenting · development</text>
  </g>

  <!-- compact presence column -->
  <g font-size="12">
    <rect x="16" y="90" width="200" height="630" rx="10" class="panel"/>
    <text x="30" y="122" font-size="20">🧙</text><text x="60" y="118" class="t">Moderator</text><text x="60" y="134" class="wait">waiting for you</text>
    <text x="30" y="170" font-size="20">🎃</text><text x="60" y="166" class="t">Product</text><text x="60" y="182" class="m">idle</text>
    <text x="30" y="218" font-size="20">🦇</text><text x="60" y="214" class="t">Architecture</text><text x="60" y="230" class="m">idle</text>
    <text x="30" y="266" font-size="20">💀</text><text x="60" y="262" class="t">Risk_and_Security</text><text x="60" y="278" class="m">idle</text>
    <text x="30" y="314" font-size="20">👻</text><text x="60" y="310" class="t">Verification</text><text x="60" y="326" class="m">idle</text>
    <rect x="26" y="346" width="180" height="44" rx="2" fill="#11161c" stroke="#c9d1d9" stroke-dasharray="4 3"/>
    <text x="34" y="374" font-size="18">⚖</text><text x="58" y="366" fill="#c9d1d9" class="mono" font-size="10">Verifier · code, no LLM</text><text x="58" y="382" class="m mono" font-size="10">checks listed, not run</text>
  </g>

  <!-- decision doc review -->
  <rect x="232" y="90" width="752" height="630" rx="10" class="panel"/>
  <text x="252" y="118" class="t" font-size="16" font-weight="700">Decision_Doc · draft 2</text>
  <text x="430" y="118" class="m mono" font-size="11">draft hash 7c1e…a9 · not frozen</text>
  <text x="964" y="118" class="m" font-size="12" text-anchor="end">Reviewed 4 of 7 · 1 rejected · 2 pending</text>

  <g font-size="13">
    <!-- item rows: status, title, summary, buttons -->
    <rect x="248" y="134" width="720" height="50" rx="8" fill="#16241a" stroke="#2f5d36"/>
    <text x="262" y="164" class="work">✓</text><text x="284" y="156" class="t" font-weight="600">1 Purpose and workflows</text>
    <text x="284" y="174" class="m" font-size="12">B · "Add bookmark": suggest tags from the user's own tags</text>
    <text x="952" y="164" class="work" font-size="12" text-anchor="end">Accepted</text>

    <rect x="248" y="190" width="720" height="50" rx="8" fill="#16241a" stroke="#2f5d36"/>
    <text x="262" y="220" class="work">✓</text><text x="284" y="212" class="t" font-weight="600">2 Scope</text>
    <text x="284" y="230" class="m" font-size="12">In: tag suggestions on add and edit. Out: bulk retagging, new tags</text>
    <text x="952" y="220" class="work" font-size="12" text-anchor="end">Accepted</text>

    <!-- approach: exactly one selectable -->
    <rect x="248" y="246" width="720" height="116" rx="8" fill="#16241a" stroke="#2f5d36"/>
    <text x="262" y="276" class="work">✓</text><text x="284" y="268" class="t" font-weight="600">3 Approach (choose exactly one)</text>
    <circle cx="294" cy="292" r="6" fill="#7cff6b"/><text x="308" y="296" class="t" font-size="12">UI change: "Suggest tags" button on the add form · effort M · risk low</text>
    <circle cx="294" cy="314" r="6" fill="none" stroke="#9b8fae"/><text x="308" y="318" class="t" font-size="12">Independent agent that tags new bookmarks through the API · effort S</text>
    <circle cx="294" cy="336" r="6" fill="none" stroke="#5a4d6a"/><text x="308" y="340" class="m" font-size="12">Mix · not selectable: no acceptance checks (incomplete)</text>
    <text x="952" y="276" class="work" font-size="12" text-anchor="end">Accepted</text>
    <text x="284" y="356" class="m" font-size="11">LLM assessment, not a guarantee</text>

    <!-- rejected item being revised -->
    <rect x="248" y="368" width="720" height="70" rx="8" fill="#2a1418" stroke="#ff5468"/>
    <text x="262" y="398" class="fail">✗</text><text x="284" y="390" class="t" font-weight="600">4 UI impact</text>
    <text x="284" y="408" class="m" font-size="12">Your reason: "Show suggestions as chips, not a dropdown."</text>
    <text x="284" y="428" class="m" font-size="12">Revised in draft 3 after you send it back · items whose content does not change keep your verdict</text>
    <text x="952" y="398" class="fail" font-size="12" text-anchor="end">Rejected</text>

    <!-- pending item with buttons -->
    <rect x="248" y="444" width="720" height="90" rx="8" fill="#221a10" stroke="#ffc857"/>
    <text x="262" y="474" class="wait">●</text><text x="284" y="466" class="t" font-weight="600">5 Executable acceptance checks</text>
    <text x="284" y="486" class="t" font-size="12">• Browser check: the add form shows "Suggest tags"; clicking it fills chips</text>
    <text x="284" y="504" class="t" font-size="12">• Target tests: <tspan class="mono" font-size="11">bookmarks/tests/test_tag_suggest.py</tspan> pass</text>
    <text x="284" y="522" class="fail" font-size="12">⚠ Unverified: cites "views/ai.py", file not found</text>
    <rect x="786" y="456" width="80" height="28" rx="14" fill="#2f5d36"/><text x="826" y="475" class="t" font-size="12" text-anchor="middle">Accept</text>
    <rect x="874" y="456" width="80" height="28" rx="14" fill="#5d2f36"/><text x="914" y="475" class="t" font-size="12" text-anchor="middle">Reject…</text>

    <rect x="248" y="540" width="720" height="40" rx="8" fill="#1d1726" stroke="#3a2d4a"/>
    <text x="262" y="565" class="m">●</text><text x="284" y="565" class="t" font-weight="600">6 Risks</text><text x="952" y="565" class="m" font-size="12" text-anchor="end">Pending</text>
    <rect x="248" y="586" width="720" height="40" rx="8" fill="#1d1726" stroke="#3a2d4a"/>
    <text x="262" y="611" class="m">●</text><text x="284" y="611" class="t" font-weight="600">7 Open questions</text><text x="952" y="611" class="m" font-size="12" text-anchor="end">Pending</text>
  </g>

  <!-- freeze bar -->
  <rect x="248" y="642" width="720" height="62" rx="10" fill="#140f1b" stroke="#3a2d4a"/>
  <text x="264" y="668" class="m" font-size="12">Freeze is enabled when every item is accepted and one complete approach is chosen.</text>
  <text x="264" y="688" class="m" font-size="12">Freezing records version 1, its content hash, you and the time. A frozen version never changes.</text>
  <rect x="660" y="654" width="140" height="38" rx="19" fill="#3a2d4a"/><text x="730" y="678" class="m" font-size="12" font-weight="700" text-anchor="middle">Send back (1 rejected)</text>
  <rect x="808" y="654" width="146" height="38" rx="19" fill="#3a2d4a"/><text x="881" y="678" class="m" font-size="13" font-weight="700" text-anchor="middle">🔒 Freeze v1</text>

  <!-- right: history -->
  <rect x="1000" y="90" width="264" height="630" rx="10" class="panel"/>
  <text x="1016" y="118" class="t" font-size="13" font-weight="700">History</text>
  <g font-size="12">
    <text x="1016" y="146" class="m">14:31 draft 1 submitted</text>
    <text x="1016" y="166" class="fail">14:32 schema rejected: risks missing</text>
    <text x="1016" y="186" class="m">14:33 draft 2 submitted</text>
    <text x="1016" y="206" class="work">14:34 you accepted items 1-3</text>
    <text x="1016" y="226" class="fail">14:35 you rejected item 4</text>
  </g>

  <rect x="16" y="736" width="1248" height="48" rx="24" class="panel"/>
  <text x="40" y="766" class="m" font-size="14">To: Moderator ▾   Ask about any item or request a change…</text>
</svg>
