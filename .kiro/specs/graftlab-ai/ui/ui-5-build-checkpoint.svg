<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Inter, system-ui, sans-serif">
  <title>UI 5 Workspace: development, question and checkpoint</title>
  <style>
    .bg{fill:#0f0b14}.panel{fill:#1a1422;stroke:#3a2d4a}.t{fill:#e9e3f0}.m{fill:#9b8fae}
    .work{fill:#7cff6b}.think{fill:#8fd3ff}.wait{fill:#ffc857}.fail{fill:#ff5468}
    .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  </style>
  <rect class="bg" width="1280" height="800"/>
  <rect width="1280" height="48" fill="#140f1b"/>
  <text x="20" y="30" class="t" font-size="15" font-weight="600">🧪 GraftLab AI</text>
  <text x="170" y="30" class="m mono" font-size="13">sissbruecker/linkding @ v1.47.0 · Decision_Doc v1 🔒</text>
  <rect x="1180" y="14" width="80" height="22" rx="11" fill="#7cff6b"/><text x="1220" y="30" fill="#0f0b14" font-size="12" font-weight="700" text-anchor="middle">● LIVE</text>
  <g font-size="12">
    <text x="20" y="72" class="work">✓ … ✓ frozen ✓ planning ✓ documenting ✓ target_check</text>
    <text x="380" y="72" class="t" font-weight="700">▶ story S1 · review → run → checkpoint → verify</text>
    <text x="760" y="72" class="m">Stories done 0 of 2</text>
  </g>

  <g font-size="13">
    <rect x="16" y="90" width="264" height="74" rx="10" class="panel"/>
    <text x="30" y="128" font-size="26">🧪</text><text x="68" y="114" class="t" font-weight="600">Code_Agent</text>
    <text x="68" y="134" class="wait">waiting for answer · Moderator · 42 s</text>
    <text x="68" y="152" class="m" font-size="11">attempt 1 of 3 · container per Task</text>

    <rect x="16" y="172" width="264" height="74" rx="10" class="panel"/>
    <text x="30" y="210" font-size="26">🐈</text><text x="68" y="196" class="t" font-weight="600">Tech_Manager</text>
    <text x="68" y="216" class="m">idle · last verdict: request changes</text>
    <text x="68" y="234" class="m" font-size="11">LLM judgment, not a guarantee</text>

    <rect x="16" y="254" width="264" height="58" rx="10" class="panel"/>
    <text x="30" y="292" font-size="26">🧙</text><text x="68" y="278" class="t" font-weight="600">Moderator</text><text x="68" y="298" class="wait">waiting for you</text>

    <rect x="16" y="320" width="264" height="92" rx="2" fill="#11161c" stroke="#c9d1d9" stroke-dasharray="4 3"/>
    <text x="30" y="358" font-size="24">⚖</text><text x="68" y="342" fill="#c9d1d9" font-weight="600" class="mono" font-size="12">Verifier · code, no LLM</text>
    <text x="68" y="362" class="m mono" font-size="11">S1: runs after your confirmation</text>
    <text x="68" y="380" class="m mono" font-size="11">☐ browser_check 0/3 steps</text>
    <text x="68" y="398" class="m mono" font-size="11">☐ test_suite 1 file</text>
  </g>

  <rect x="296" y="90" width="520" height="630" rx="10" class="panel"/>
  <text x="312" y="114" class="m" font-size="12" font-weight="600">ACTIVITY · S1 "Suggest tags on the add form"</text>
  <g font-size="13">
    <text x="312" y="144" class="m">15:10</text><text x="360" y="144" class="t">🧪 edit <tspan class="mono" font-size="12">bookmarks/views/bookmarks.py</tspan></text>
    <text x="312" y="168" class="m">15:11</text><text x="360" y="168" class="t">🧪 run tests · 4 passed, 1 failed</text>
    <text x="312" y="192" class="m">15:12</text><text x="360" y="192" class="t">🐈 review: changed 3 files, 1 outside the contract</text>
    <text x="312" y="216" class="m">15:12</text><text x="360" y="216" class="fail">✗ request changes: "settings.py is not part of S1"</text>
    <text x="312" y="240" class="m">15:13</text><text x="360" y="240" class="t">🧪 asks: suggestions for tags the user never used?</text>
  </g>
  <!-- question card, feature words -->
  <rect x="312" y="262" width="488" height="150" rx="10" fill="#221a10" stroke="#ffc857"/>
  <text x="328" y="288" class="wait" font-size="13" font-weight="700">🧙 Question from development (in feature words)</text>
  <text x="328" y="312" class="t" font-size="13">Should the suggestion ever offer a tag you have never used?</text>
  <text x="328" y="332" class="m" font-size="12">The Decision_Doc says "only your existing tags". The developer asks to confirm.</text>
  <g font-size="13">
    <rect x="328" y="348" width="200" height="32" rx="16" fill="#3a2d4a"/><text x="428" y="369" class="t" text-anchor="middle">No, only existing tags</text>
    <rect x="538" y="348" width="240" height="32" rx="16" fill="#3a2d4a"/><text x="658" y="369" class="t" text-anchor="middle">Yes (changes the decision)</text>
  </g>
  <text x="328" y="400" class="m" font-size="11">"Yes" returns to the meeting and creates Decision_Doc v2.</text>

  <!-- checkpoint card (earlier story shape) -->
  <rect x="312" y="428" width="488" height="276" rx="10" fill="#1d1726" stroke="#ff8a1f"/>
  <text x="328" y="454" fill="#ff8a1f" font-size="13" font-weight="700">Checkpoint demo · S1 Suggest tags on the add form</text>
  <text x="328" y="476" class="t" font-size="12">What it does: on the add form, "Suggest tags" fills chips from your tags.</text>
  <rect x="328" y="490" width="456" height="150" rx="6" fill="#f4f4f5"/>
  <rect x="344" y="506" width="300" height="20" fill="#fff" stroke="#a1a1aa"/>
  <rect x="652" y="506" width="116" height="20" rx="4" fill="#ff8a1f"/><text x="710" y="520" fill="#1a0f05" font-size="10" text-anchor="middle">Suggest tags</text>
  <rect x="344" y="540" width="56" height="20" rx="10" fill="#e4e4e7"/><text x="372" y="554" fill="#3f3f46" font-size="10" text-anchor="middle">python</text>
  <rect x="406" y="540" width="56" height="20" rx="10" fill="#e4e4e7"/><text x="434" y="554" fill="#3f3f46" font-size="10" text-anchor="middle">django</text>
  <text x="344" y="628" fill="#52525b" font-size="10" class="mono">Run_Environment screenshot · browser check step 2</text>
  <g font-size="13">
    <rect x="328" y="654" width="140" height="34" rx="17" fill="#2f5d36"/><text x="398" y="676" class="t" text-anchor="middle">Confirm</text>
    <rect x="478" y="654" width="170" height="34" rx="17" fill="#5d2f36"/><text x="563" y="676" class="t" text-anchor="middle">Not right, explain…</text>
  </g>

  <rect x="832" y="90" width="432" height="630" rx="10" class="panel"/>
  <g font-size="12"><text x="848" y="114" class="t" font-weight="700">Feature_Contract</text><text x="962" y="114" class="m">Board · Docs · Engineering_Details</text></g>
  <g font-size="12">
    <text x="848" y="146" class="t" font-weight="600">Should do</text>
    <text x="848" y="166" class="t">• Offer up to 5 tags taken from the user's tags</text>
    <text x="848" y="186" class="t">• Apply only when the user clicks a chip</text>
    <text x="848" y="214" class="t" font-weight="600">Should not do</text>
    <text x="848" y="234" class="t">• Create tags · change other bookmarks · call the internet</text>
    <text x="848" y="262" class="t" font-weight="600">Checked by</text>
    <text x="848" y="282" class="t">• browser_check (3 steps) · test_suite (1 file)</text>
    <text x="848" y="318" class="t" font-weight="600">Task_Board</text>
    <rect x="848" y="330" width="128" height="200" rx="6" fill="#140f1b"/><text x="860" y="350" class="m">To do</text>
    <rect x="856" y="362" width="112" height="40" rx="4" fill="#2a2036"/><text x="864" y="386" class="t" font-size="11">S2 Edit form</text>
    <rect x="984" y="330" width="128" height="200" rx="6" fill="#140f1b"/><text x="996" y="350" class="m">In progress</text>
    <rect x="992" y="362" width="112" height="40" rx="4" fill="#2a2036" stroke="#ffc857"/><text x="1000" y="386" class="t" font-size="11">S1 Add form</text>
    <rect x="1120" y="330" width="128" height="200" rx="6" fill="#140f1b"/><text x="1132" y="350" class="m">Verified</text>
    <text x="848" y="560" class="m">Engineering_Details (collapsed): diff, changed files, review reasons</text>
  </g>

  <rect x="16" y="736" width="1248" height="48" rx="24" class="panel"/>
  <text x="40" y="766" class="m" font-size="14">To: Moderator ▾   Steer or pause development…</text>
  <rect x="1150" y="744" width="100" height="32" rx="16" fill="#5d2f36"/><text x="1200" y="765" class="t" font-size="13" text-anchor="middle">■ Stop</text>
</svg>
