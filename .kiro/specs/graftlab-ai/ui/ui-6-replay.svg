<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Inter, system-ui, sans-serif">
  <title>UI 6 Replay</title>
  <style>
    .bg{fill:#0f0b14}.panel{fill:#1a1422;stroke:#3a2d4a}.t{fill:#e9e3f0}.m{fill:#9b8fae}
    .work{fill:#7cff6b}.think{fill:#8fd3ff}.wait{fill:#ffc857}.fail{fill:#ff5468}
    .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  </style>
  <rect class="bg" width="1280" height="800"/>
  <!-- permanent Replay label replaces LIVE -->
  <rect width="1280" height="48" fill="#1f1a10"/>
  <text x="20" y="30" class="t" font-size="15" font-weight="600">🧪 GraftLab AI</text>
  <text x="170" y="30" class="m mono" font-size="13">sissbruecker/linkding @ v1.47.0 · recorded 2026-12-02</text>
  <rect x="1150" y="12" width="110" height="26" rx="13" fill="#ffc857"/><text x="1205" y="30" fill="#1f1a10" font-size="13" font-weight="800" text-anchor="middle">⏵ REPLAY</text>
  <text x="20" y="72" class="wait" font-size="12">Replay of recorded events. Nothing here is live. Typing speed in Replay is simulated.</text>

  <g font-size="13">
    <rect x="16" y="90" width="264" height="58" rx="10" class="panel"/>
    <text x="30" y="128" font-size="26">🎃</text><text x="68" y="114" class="t" font-weight="600">Product</text><text x="68" y="134" class="work">● speaking (at playhead)</text>
    <rect x="16" y="156" width="264" height="58" rx="10" class="panel"/>
    <text x="30" y="194" font-size="26">🦇</text><text x="68" y="180" class="t" font-weight="600">Architecture</text><text x="68" y="200" class="m">idle</text>
    <rect x="16" y="222" width="264" height="58" rx="10" class="panel"/>
    <text x="30" y="260" font-size="26">🧙</text><text x="68" y="246" class="t" font-weight="600">Moderator</text><text x="68" y="266" class="m">idle</text>
    <rect x="16" y="288" width="264" height="58" rx="2" fill="#11161c" stroke="#c9d1d9" stroke-dasharray="4 3"/>
    <text x="30" y="326" font-size="24">⚖</text><text x="68" y="312" fill="#c9d1d9" font-weight="600" class="mono" font-size="12">Verifier · code, no LLM</text><text x="68" y="332" class="m mono" font-size="11">final: 1 of 2 stories verified</text>
  </g>

  <rect x="296" y="90" width="520" height="560" rx="10" class="panel"/>
  <text x="312" y="114" class="m" font-size="12" font-weight="600">ACTIVITY · same layout as live</text>
  <g font-size="13">
    <rect x="312" y="130" width="488" height="84" rx="8" fill="#211a2b"/>
    <text x="326" y="152" class="t" font-weight="600">🎃 Product</text><text x="786" y="152" class="wait" font-size="11" text-anchor="end">replayed</text>
    <text x="326" y="176" class="t">Yes. Suggest tags only from the user's existing tags,</text>
    <text x="326" y="196" class="t">and let the user confirm▍</text>
    <rect x="312" y="226" width="488" height="40" rx="8" fill="#2a1418" stroke="#ff5468"/>
    <text x="326" y="251" class="fail">✗ Recorded failure: story S2 test_suite failed (2 tests)</text>
  </g>
  <text x="312" y="630" class="m" font-size="12">Controls that change the Task are hidden; cards are shown with the recorded answers.</text>

  <rect x="832" y="90" width="432" height="560" rx="10" class="panel"/>
  <text x="848" y="114" class="t" font-size="12" font-weight="700">Result (from Verifier)</text>
  <g font-size="12">
    <text x="848" y="146" class="work">✓ S1 Suggest tags on the add form · 3/3 browser steps · tests pass</text>
    <text x="848" y="168" class="fail">✗ S2 Suggest tags on the edit form · 2 tests failed</text>
    <text x="848" y="198" class="m">Outcome: partial. Role statements are not used to decide it.</text>
  </g>

  <!-- replay bar -->
  <rect x="16" y="668" width="1248" height="116" rx="12" fill="#1f1a10" stroke="#ffc857"/>
  <g font-size="13">
    <circle cx="52" cy="712" r="18" fill="#ffc857"/><text x="52" y="718" fill="#1f1a10" font-size="16" text-anchor="middle">❚❚</text>
    <text x="88" y="718" class="t">12:04 / 41:10</text>
    <rect x="200" y="706" width="900" height="10" rx="5" fill="#3a2d4a"/>
    <rect x="200" y="706" width="264" height="10" rx="5" fill="#ffc857"/>
    <circle cx="464" cy="711" r="9" fill="#fff"/>
    <!-- phase markers -->
    <g font-size="10" class="m"><text x="200" y="740">reading</text><text x="290" y="740">gathering</text><text x="420" y="740">meeting</text><text x="560" y="740">decision</text><text x="660" y="740">planning</text><text x="790" y="740">S1</text><text x="950" y="740">S2</text></g>
    <rect x="955" y="702" width="4" height="18" fill="#ff5468"/>
    <text x="1130" y="718" class="t">Speed 1× ▾</text>
    <text x="200" y="770" class="m" font-size="12">Seek jumps to any event; the UI state is rebuilt from the events up to that point.</text>
  </g>
</svg>
